<!doctype html>
<html class="bg-gray-100" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/css/style.css" rel="stylesheet">
    <title>Articles</title>
  </head>
  <body>
    <div class="flex space-x-4 bg-violet-500 p-5 justify-between">
        <div class="flex gap-2">
            <a data-navigo href="/" class="p-3 rounded-lg bg-violet-600 text-white hover:bg-violet-700">Tableau de bord</a>
            <a class="p-3 rounded-lg bg-violet-600 text-white hover:bg-violet-700" data-navigo href="/panier">Panier</a>
            <a id="dashboard" class="p-3 rounded-lg bg-violet-600 text-white hover:bg-violet-700" data-navigo href="/dashboard">Dashboard</a>
        </div>
        <button onclick="modalLogin()" class="p-3 rounded-lg bg-violet-600 text-white cursor-pointer hover:bg-violet-700">Se connecter</button>
    </div>
    <div class="p-3" id="app"></div>
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
      <div id="modalOverlay" class="absolute inset-0 bg-black bg-opacity-40"></div>

      <div id="modalContent" class="relative bg-white rounded-lg p-6 max-w-md w-full shadow-lg z-10">
        <button id="closeModal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 font-bold text-xl">&times;</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
